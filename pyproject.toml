[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "animatecanvas"
version = "0.2.0"
description = "AnimateCanvas: composable kinematic cues for motion generation and control"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3", "torch>=2.6", "einops>=0.6",
    "transformers>=4.51,<5", "huggingface_hub>=0.34,<1",
    "safetensors>=0.4", "scipy>=1.9", "torchdiffeq>=0.2",
    "sentencepiece>=0.1.99",
]

[tool.setuptools.packages.find]
include = ["animatecanvas*"]

[project.urls]
Homepage = "https://zeyuling.github.io/AnimateCanvas/"
"Motius implementation" = "https://github.com/ZeyuLing/Motius"
